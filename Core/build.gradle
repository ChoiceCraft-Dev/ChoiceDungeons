// `version` comes from gradle.properties; a release build overrides it with -Pversion=X.Y.Z.

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("io.lumine:Mythic-Dist:5.11.2-SNAPSHOT")
    compileOnly("io.lumine:MythicLib-dist:1.7.1-SNAPSHOT")
    compileOnly("net.Indyuce:MMOItems-API:6.10.1-SNAPSHOT")
    compileOnly("me.clip:placeholderapi:2.11.7")
    compileOnly("com.onarandombox.multiversecore:Multiverse-Core:4.3.1")
    compileOnly("com.onarandombox.multiverseinventories:Multiverse-Inventories:4.2.3")
    compileOnly("org.mvplugins.multiverse.core:multiverse-core:5.3.3")
    compileOnly("org.mvplugins.multiverse.inventories:multiverse-inventories:5.3.3")

    implementation("com.zaxxer:HikariCP:7.0.2")
    implementation("redis.clients:jedis:7.2.0")

    // compileOnly does not reach the test classpath, and the tests parse real config
    // and language resources with Bukkit's YamlConfiguration.
    testImplementation("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
}

tasks.named('jar') {
    archiveClassifier.set('original')
}

shadowJar {
    archiveBaseName.set('SinceDungeon')
    destinationDirectory.set(rootProject.layout.buildDirectory.dir('libs'))
    relocate 'org.sqlite', 'net.danh.sinceDungeon.libs.sqlite'
    relocate 'com.mysql', 'net.danh.sinceDungeon.libs.mysql'
    relocate 'redis.clients', 'net.danh.sinceDungeon.libs.redis.clients'
}

build.dependsOn shadowJar

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
