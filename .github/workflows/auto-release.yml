name: Auto Release

# Publish a GitHub Release automatically whenever gradle.properties' `version`
# lands on the default branch without an existing release. BeaconOps' private
# plugin sync picks it up from there: bump `version=`, merge, done.
#
# Mirrors the other ChoiceCraft-Dev plugin repos (e.g. choiceadmin): the Core
# jar is published under the fixed name `SinceDungeon.jar` on a
# `choicedungeons/v<version>` tag. BeaconOps matches on both (see
# db/migrate-mc-custom-plugin-sync.js in the platform repo), so changing either
# silently stops deployments — releases publish, nothing deploys.

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # Only the default branch cuts releases — feature / PR branches must not.
    # Read dynamically so a future default-branch rename doesn't break this.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether a release is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No 'version=' found in gradle.properties" >&2
            exit 1
          fi
          TAG="choicedungeons/v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG missing — will build and publish."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 for the compile toolchain (paper-api 26.2 requires it), 21 to run
          # Gradle itself, which cannot host a 25 daemon on this Gradle version.
          java-version: |
            25
            21
          cache: gradle

      - name: Build ${{ needs.check.outputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean :Core:shadowJar --no-daemon --stacktrace -Pversion=${{ needs.check.outputs.version }}

      - name: Locate and stage the built jar
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SinceDungeon-*.jar' ! -name '*-original.jar' ! -name '*PremiumAddon*' | sort | tail -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "::error::No Core jar produced under build/libs" >&2
            exit 1
          fi
          cp "$JAR" SinceDungeon.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: SinceDungeon.jar
          draft: false
          prerelease: false
